<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>EduCore SGE - Panel de Pruebas de Admisión</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 30px auto; padding: 20px; background: #f4f6f9; color: #333; }
    .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
    h2 { margin-top: 0; color: #1e293b; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #475569; }
    input { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; font-size: 14px; }    input:focus { border-color: #3b82f6; outline: none; }
    button { background: #2563eb; color: white; border: none; padding: 12px 20px; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; font-weight: bold; }
    button:hover { background: #1d4ed8; }
    pre { background: #0f172a; color: #38bdf8; padding: 15px; border-radius: 6px; overflow-x: auto; font-size: 13px; max-height: 250px; }
    .status { font-weight: bold; padding: 10px; border-radius: 4px; margin-top: 10px; display: none; }
    .success { background: #dcfce7; color: #16a34a; }
    .error { background: #fee2e2; color: #dc2626; }
  </style>
</head>
<body>

<div class="card">
  <h2>EduCore SGE - Registro de Alumnos</h2>

  <div class="form-group">
    <label>ID de la Institución (Colegio):</label>
    <input type="text" id="institutionId" value="88888888-4444-4444-4444-121212121212">
  </div>

  <div class="form-group">
    <label>Nombre del Alumno:</label>
    <input type="text" id="firstName" value="Juan">
  </div>

  <div class="form-group">
    <label>Apellido del Alumno:</label>
    <input type="text" id="lastName" value="Perez">
  </div>

  <div class="form-group">
    <label>Número de Documento:</label>
    <input type="text" id="documentNumber" value="55123456">
  </div>

  <div class="form-group">
    <label>Fecha de Nacimiento (Sala de 3, 4 o 5):</label>
    <input type="date" id="birthDate" value="2022-04-12">
  </div>

  <button onclick="enviarDatos()">Enviar Matrícula al Backend</button>
  <div id="statusBox" class="status"></div>
</div>

<div class="card">
  <h2>Respuesta del Servidor (JSON)</h2>
  <pre id="jsonResponse">// Aquí aparecerá la respuesta de tu base de datos MySQL...</pre>
</div>

<script>
  async function enviarDatos() {
    const url = 'http://localhost:8080/api/v1/students';
    const instId = document.getElementById('institutionId').value;
    const statusBox = document.getElementById('statusBox');
    const jsonResponse = document.getElementById('jsonResponse');

    const payload = {
      firstName: document.getElementById('firstName').value,
      lastName: document.getElementById('lastName').value,
      documentNumber: document.getElementById('documentNumber').value,
      birthDate: document.getElementById('birthDate').value
    };

    statusBox.style.display = 'block';
    statusBox.className = 'status';
    statusBox.innerText = 'Enviando petición a Spring Boot...';
    jsonResponse.innerText = 'Cargando...';

    try {
      const response = await fetch(url, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'X-Institution-Id': instId
        },
        body: JSON.stringify(payload)
      });

      const data = await response.json();

      if (response.ok) {
        statusBox.classList.add('success');
        statusBox.innerText = '¡Conexión Exitosa! Alumno guardado en MySQL de forma segura.';
        jsonResponse.innerText = JSON.stringify(data, null, 2);
      } else {
        statusBox.classList.add('error');
        statusBox.innerText = 'Error del Servidor: ' + response.status;
        jsonResponse.innerText = JSON.stringify(data, null, 2);
      }
    } catch (error) {
      statusBox.classList.add('error');
      statusBox.innerText = 'Error de Red: No se pudo conectar con http://localhost:8080. ¿Prendiste el backend?';
      jsonResponse.innerText = error.toString();
    }
  }
</script>
</body>
</html>
